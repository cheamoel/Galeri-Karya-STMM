<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Kategori · Galeri Karya STMM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

<body data-halaman="kategori">
  <div class="app">
    <!-- Bilah atas -->
    <header class="bilah-atas">
      <h1 class="judul-layar">Kategori</h1>
    </header>

    <main class="konten">
      <!-- Deret Chip Kategori -->
      <div class="deret-chip" id="daftar-chip-kategori"></div>

      <!-- Baris Status & Sortir -->
      <div class="baris-status">
        <span class="baris-status__teks" id="teks-status-karya"></span>
        <div class="pilihan-urut">
          <label for="pilih-urut" class="sr-only">Urutkan karya</label>
          <select id="pilih-urut" class="pilihan-urut__select">
            <option value="terbaru">Terbaru</option>
            <option value="terlama">Terlama</option>
            <option value="judul">Judul (A-Z)</option>
          </select>
          <span class="pilihan-urut__panah" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="m6 9 6 6 6-6"/>
            </svg>
          </span>
        </div>
      </div>

      <!-- Grid Kartu Karya -->
      <div class="grid-2" id="grid-karya"></div>
    </main>

    <!-- Navigasi bawah -->
    <nav class="nav-bawah" id="nav-bawah" aria-label="Navigasi utama">

      </a>
      <a class="nav-bawah__item" href="kategori.html" aria-current="page">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg>Kategori
      </a>
      <a class="nav-bawah__item" href="cari.html">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM21 21l-5-5"/></svg>Cari
      </a>

      </a>
    </nav>
  </div>

  <script src="js/data.js"></script>
